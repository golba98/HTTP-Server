name: Documentation guard fixtures
on:
  pull_request:
    paths:
      [
        'scripts/check_documentation.py',
        'scripts/test_documentation_policy.py',
        '.github/documentation-policy.json',
        '.github/workflows/documentation*.yml',
      ]
  push:
    paths:
      [
        'scripts/check_documentation.py',
        'scripts/test_documentation_policy.py',
        '.github/documentation-policy.json',
        '.github/workflows/documentation*.yml',
      ]
permissions:
  contents: read
jobs:
  fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: python3 scripts/test_documentation_policy.py
