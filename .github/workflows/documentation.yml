name: Documentation publication review
on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to recheck after owner approval
        required: true
permissions:
  contents: read
  issues: read
  pull-requests: read
  statuses: write
jobs:
  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Inspect PR Git objects with trusted policy code
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
        run: |
          case "$PR_NUMBER" in ''|*[!0-9]*) exit 1 ;; esac
          python3 scripts/check_documentation.py --ci "$PR_NUMBER"
