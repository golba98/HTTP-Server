name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    name: ${{ matrix.preset }} (${{ matrix.compiler }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler: [g++-14, clang++-20]
        preset: [debug, sanitize]
    steps:
      - uses: actions/checkout@v4

      # libclang-rt provides Clang's sanitizer runtimes.
      - name: Install LLVM 20
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo gpg --dearmor -o /usr/share/keyrings/llvm.gpg
          echo "deb [signed-by=/usr/share/keyrings/llvm.gpg] http://apt.llvm.org/noble/ llvm-toolchain-noble-20 main" | sudo tee /etc/apt/sources.list.d/llvm20.list
          sudo apt-get update && sudo apt-get install -y clang-20 libclang-rt-20-dev
      - name: Install tools
        run: sudo apt-get install -y ninja-build

      # The runners' high ASLR entropy breaks older sanitizer runtimes.
      - name: Reduce ASLR entropy for sanitizers
        if: matrix.preset != 'debug'
        run: sudo sysctl vm.mmap_rnd_bits=28

      - name: Configure
        run: >
          cmake --preset ${{ matrix.preset }}
          -DCMAKE_CXX_COMPILER=${{ matrix.compiler }}
          -DHTTP_SERVER_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }}

  tsan:
    name: tsan (clang++-20)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install LLVM 20
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo gpg --dearmor -o /usr/share/keyrings/llvm.gpg
          echo "deb [signed-by=/usr/share/keyrings/llvm.gpg] http://apt.llvm.org/noble/ llvm-toolchain-noble-20 main" | sudo tee /etc/apt/sources.list.d/llvm20.list
          sudo apt-get update && sudo apt-get install -y clang-20 libclang-rt-20-dev
      - name: Install tools
        run: sudo apt-get install -y ninja-build

      - name: Reduce ASLR entropy for sanitizers
        run: sudo sysctl vm.mmap_rnd_bits=28

      - name: Configure
        run: >
          cmake --preset tsan
          -DCMAKE_CXX_COMPILER=clang++-20
          -DHTTP_SERVER_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build --preset tsan

      - name: Test
        run: ctest --preset tsan

  fuzz:
    name: fuzz (clang++-20)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install LLVM 20
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo gpg --dearmor -o /usr/share/keyrings/llvm.gpg
          echo "deb [signed-by=/usr/share/keyrings/llvm.gpg] http://apt.llvm.org/noble/ llvm-toolchain-noble-20 main" | sudo tee /etc/apt/sources.list.d/llvm20.list
          sudo apt-get update && sudo apt-get install -y clang-20 libclang-rt-20-dev
      - name: Install tools
        run: sudo apt-get install -y ninja-build

      - name: Reduce ASLR entropy for sanitizers
        run: sudo sysctl vm.mmap_rnd_bits=28

      - name: Configure
        run: >
          cmake --preset fuzz
          -DCMAKE_CXX_COMPILER=clang++-20
          -DHTTP_SERVER_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build --preset fuzz

      # Also replays the seed corpora once.
      - name: Test
        run: ctest --preset fuzz

      # New inputs go to a scratch directory so the checked-in seeds stay as
      # they are.
      - name: Fuzz for one minute per target
        run: |
          mkdir -p "$RUNNER_TEMP/artifacts"
          for fuzzer in request_parser path; do
            mkdir -p "$RUNNER_TEMP/corpus/$fuzzer"
            "build/fuzz/fuzz/${fuzzer}_fuzzer" -max_total_time=60 -dict=fuzz/http.dict \
              -artifact_prefix="$RUNNER_TEMP/artifacts/" \
              "$RUNNER_TEMP/corpus/$fuzzer" "fuzz/corpus/$fuzzer"
          done

      - name: Upload crashing inputs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: ${{ runner.temp }}/artifacts

  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # Pinned to the same LLVM major as the development machine so local and
      # CI formatting agree.
      - name: Install tools
        run: |
          sudo apt-get update && sudo apt-get install -y ninja-build
          pip install clang-format==22.1.8 clang-tidy==22.1.8

      - name: clang-format
        run: clang-format --dry-run --Werror $(git ls-files '*.cpp' '*.hpp')

      - name: Configure for clang-tidy
        run: cmake --preset debug -DCMAKE_CXX_COMPILER=clang++-20

      - name: clang-tidy
        run: clang-tidy -p build/debug --warnings-as-errors='*' $(git ls-files 'src/*.cpp' 'app/*.cpp')
